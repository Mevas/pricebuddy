# Fork-only: publish this fork's image to GHCR for self-hosting.
# Tag a commit (e.g. v1.0.55-mevas.1) to build ghcr.io/<owner>/pricebuddy:<tag>.
on:
  push:
    tags: ['v*-mevas.*']

name: Publish fork image

jobs:
  publish:
    if: github.repository != 'jez500/pricebuddy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Update version file and image name
        run: |
          echo "${{ github.ref_name }}" > VERSION
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pricebuddy" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: ./docker/php.dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
